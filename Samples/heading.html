 <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Heading Example</title>
    </head>
    <body>
        <table border="1">
            <caption>Table Example</caption>
            colgroup>
                <col style="background-color: lightblue;">
                <col style="background-color: lightgreen;">
            <tr>
                <td>Cell 1</td>
                <td>Cell 2</td>
                <td>Cell 3</td>
                <td>Cell 4</td>
            </tr>
            <tr>
                <td>Cell 5</td>
                <td>Cell 6</td>
                <td>Cell 7</td>
                <td>Cell 8</td>
            </tr>
    </body>
 </html>
